<style>
    body { background: #18181b; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    .sidebar {
        width: 270px; background: #22223a; height: 100vh; float: left; padding: 10px 0 0 0; box-sizing: border-box;
        position: fixed; left: 0; top: 0; bottom: 0; overflow-y: auto;
    }
    /* Brand plate. The logo artwork is dark on a light ground, so it keeps its
       own background and sits on the sidebar as a rounded panel. */
    .sidebar .brand { display: block; margin: 4px 16px 2px 16px; }
    .sidebar .brand img {
        display: block; width: 100%; max-width: 208px; height: auto;
        margin: 0 auto; border-radius: 10px;
    }
    .sidebar .menu { margin-top: 14px; }
    .sidebar .menu a { display: block; color: #bbb; text-decoration: none; font-size: 17px; padding: 7px 30px;}
    .sidebar .balance { margin: 30px 30px 10px 30px; font-size: 19px; color: #c2f262; }
    .sidebar .accounts { margin: 12px 13px 0px 13px; }
    .sidebar .account { display: flex; align-items: center; justify-content: space-between; background: #2f304a; border-radius: 9px; padding: 7px 10px; margin-bottom: 7px;}
    .sidebar .account-icon { width: 22px; height: 22px; background:#bb61fa; border-radius: 4px; display:inline-flex; align-items:center; justify-content:center; margin-right:7px;}
    .sidebar .account-balance { font-size: 15px; color: #f0f0f0;}
    .sidebar .account-currency { font-size: 11px; color: #9c9cc4; letter-spacing: 0.5px; }
    .content { margin-left: 290px; padding: 0;}
    .content .header { display: flex; padding: 16px 20px; background: #232326; align-items: center;}
    .content .title { font-size: 22px; font-weight: bold; color: #fff; }
    .trans-list { margin: 0 28px; margin-top: 16px;}
    .section-date { font-size: 14px; color: #aac; margin: 24px 0 6px 0;}
    .trans { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #24243a;}
    .trans .left { display: flex; align-items: center; justify-content: space-between; }
    .trans .mid { display: flex; align-items: center; justify-content: space-between; margin-right: 120px;}
    .trans .icon { width: 34px; height: 34px; border-radius: 11px; background: #39395a; display: flex; align-items:center; justify-content:center; font-size: 21px; margin-right: 17px;}
    .trans .desc { font-size: 16px; color: #fff;}
    .trans .amt { color: #ab3d3d; font-weight: bold; font-size: 15px;}
    .trans .inc { color: #0bdd3cbc; font-weight: bold; font-size: 15px;}
    .trans .tx { color: #dd0bbebc; font-weight: bold; font-size: 15px;}
    .add-bar { position: fixed; bottom: 12px; left: 0; width: 100vw; display: flex; justify-content: flex-end; margin-left: 280px;}
    .add-btn { background: #1781ff; color: #fff; padding: 10px 28px; margin-right: 24px; border-radius: 28px; font-size:16px; border: none;}

    /* Currency picker and per currency subtotals */
    .currency-switch { margin: 10px 13px 4px 13px; }
    .currency-switch label { display: block; font-size: 12px; color: #9c9cc4; margin-bottom: 4px; letter-spacing: 0.5px; }
    .currency-switch select {
        width: 100%; background: #2f304a; color: #fff; border: 1px solid #3d3e60;
        border-radius: 8px; padding: 7px 9px; font-size: 14px;
    }
    .currency-totals { margin: 10px 13px 0 13px; }
    .currency-total {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 14px; color: #d7d7ea; padding: 4px 2px;
    }
    .currency-total .code { color: #9c9cc4; font-size: 12px; letter-spacing: 0.5px; }
    .currency-total.converted { color: #9c9cc4; font-size: 13px; padding: 0 2px 4px 10px; }
    .currency-total.grand {
        margin-top: 6px; padding-top: 8px; border-top: 1px solid #3d3e60;
        color: #c2f262; font-size: 14px;
    }
    .rate-warning {
        margin: 10px 13px; padding: 8px 10px; border-radius: 8px;
        background: #40331f; color: #ffc978; font-size: 12px; line-height: 1.4;
    }
    .rate-warning a { color: #ffd79a; }
    .credit { margin: 18px 13px 24px 13px; color: #6f6f8f; font-size: 12px; }

    .trans-table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        margin-top: 1em;
    }

    .trans-table thead {
        background-color: #4a90e2;
        color: white;
    }

    .trans-table th, .trans-table td {
        padding: 10px 15px;
        border: 1px solid #ddd;
        text-align: left;
    }

    .trans-table tbody tr:nth-child(even) {
        background-color: #000000;
    }

    .trans-table tbody tr:hover {
        background-color: #686b6d;
    }

    .trans-table .amt {
        color: #d9534f; /* red for expenses */
        font-weight: bold;
    }

    .trans-table .inc {
        color: #5cb85c; /* green for income */
        font-weight: bold;
    }

    .trans-table .tx {
        color: #f0ad4e; /* orange for transfers */
        font-weight: bold;
    }

    .trans-table .currency-code { color: #9c9cc4; font-size: 12px; }

    .status-banner {
        margin: 16px 20px; padding: 12px 14px; border-radius: 8px;
        background: #1f3a2b; color: #b6f0c8; font-size: 14px;
    }
</style>
